{% extends 'base.html' %}
{% block title %}Password Reset Complete | AVT Flower Terminal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="terminal-frame p-4 p-md-5 text-center">
      <div class="d-inline-flex align-items-center justify-content-center brand-avatar-badge mb-3" style="width: 50px; height: 50px; font-size: 22px; background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: var(--text-success);">
        <i class="bi bi-shield-check"></i>
      </div>
      <h3 class="fw-bold mb-2" style="color:var(--text-main);">Password Updated!</h3>
      <p class="small text-muted mb-4">
        Your password has been set successfully. You can now sign in to your merchant terminal with your new password.
      </p>

      <div>
        <a href="{% url 'login' %}" class="btn-cyber-cyan py-2 px-4 fs-6 text-decoration-none d-inline-flex align-items-center">
          <i class="bi bi-box-arrow-in-right me-2"></i> Sign In Now
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
